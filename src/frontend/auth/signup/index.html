<body class="bg-page text-on-surface min-h-screen flex flex-col font-body-md text-body-md overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container p-2 md:p-6">
<div id="app-shell" style="opacity:0" class="w-full max-w-[1600px] mx-auto flex flex-grow bg-background rounded-[1.75rem] shadow-sm relative overflow-hidden">
<div class="absolute -bottom-24 -left-24 w-80 h-80 rounded-full bg-secondary/10 blur-3xl pointer-events-none"></div>
<main class="relative z-10 w-full max-w-md mx-auto self-center px-margin-mobile md:px-0 py-xl flex flex-col gap-xl">
<div class="flex items-center gap-sm">
<div class="w-9 h-9 rounded-[10px] bg-primary flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-primary text-[20px]" aria-hidden="true">security</span>
</div>
<span class="font-headline-lg-mobile font-bold text-on-surface tracking-tight">ConfigGuard</span>
</div>
<header class="flex flex-col gap-xs">
<h1 class="font-headline-lg text-headline-lg text-on-surface">Create your organization</h1>
<p class="font-body-md text-body-md text-on-surface-variant">Each organization's scans and reports are visible only to its own members.</p>
</header>
<div id="notice" role="status" hidden class="rounded-xl border border-outline-variant bg-surface-container p-md font-body-sm text-body-sm text-on-surface-variant"></div>
<div id="error" role="alert" hidden class="rounded-xl bg-error-container text-on-error-container p-md font-body-sm text-body-sm"></div>
<form id="auth-form" class="flex flex-col gap-lg" novalidate>
<div class="flex flex-col gap-sm">
<label for="name" class="font-body-sm text-body-sm text-on-surface-variant">Your name</label>
<input id="name" name="name" type="text" autocomplete="name" required maxlength="100" class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-md py-3 text-on-surface placeholder:text-on-surface-variant/50 focus:border-secondary focus:ring-2 focus:ring-secondary/30 focus:outline-none transition-colors"/>
</div>
<div class="flex flex-col gap-sm">
<label for="org" class="font-body-sm text-body-sm text-on-surface-variant">Organization</label>
<input id="org" name="org" type="text" autocomplete="organization" required aria-describedby="org-hint" maxlength="100" placeholder="e.g. Acme Networks" class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-md py-3 text-on-surface placeholder:text-on-surface-variant/50 focus:border-secondary focus:ring-2 focus:ring-secondary/30 focus:outline-none transition-colors"/>
<p id="org-hint" class="font-body-sm text-body-sm text-on-surface-variant/80">You'll be its admin and can add teammates later.</p>
</div>
<div class="flex flex-col gap-sm">
<label for="email" class="font-body-sm text-body-sm text-on-surface-variant">Work email</label>
<input id="email" name="email" type="email" autocomplete="username" required placeholder="you@company.com" class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-md py-3 text-on-surface placeholder:text-on-surface-variant/50 focus:border-secondary focus:ring-2 focus:ring-secondary/30 focus:outline-none transition-colors"/>
</div>
<div class="flex flex-col gap-sm">
<label for="password" class="font-body-sm text-body-sm text-on-surface-variant">Password</label>
<input id="password" name="password" type="password" autocomplete="new-password" required aria-describedby="password-hint" minlength="10" maxlength="128" class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-md py-3 text-on-surface placeholder:text-on-surface-variant/50 focus:border-secondary focus:ring-2 focus:ring-secondary/30 focus:outline-none transition-colors"/>
<p id="password-hint" class="font-body-sm text-body-sm text-on-surface-variant/80">At least 10 characters.</p>
</div>
<div class="flex flex-col gap-sm">
<label for="confirm" class="font-body-sm text-body-sm text-on-surface-variant">Confirm password</label>
<input id="confirm" name="confirm" type="password" autocomplete="new-password" required maxlength="128" class="w-full bg-surface-container-low border border-outline-variant rounded-xl px-md py-3 text-on-surface placeholder:text-on-surface-variant/50 focus:border-secondary focus:ring-2 focus:ring-secondary/30 focus:outline-none transition-colors"/>
</div>
<button id="submit-btn" type="submit" class="w-full rounded-full bg-primary text-on-primary py-3 font-body-md text-body-md font-medium hover:opacity-90 focus:outline-none focus-visible:ring-2 focus-visible:ring-secondary focus-visible:ring-offset-2 focus-visible:ring-offset-background disabled:opacity-60 disabled:cursor-wait transition-opacity">Create organization</button>
</form>
<p class="font-body-sm text-body-sm text-on-surface-variant">Already have an account? <a href="../login/index.html" class="text-secondary hover:underline focus:outline-none focus-visible:underline">Sign in</a></p>
</main>
</div>
<script src="../../shared.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const form = $("auth-form");
const submitBtn = document.getElementById("submit-btn");
const errorBox = document.getElementById("error");
const submitLabel = submitBtn.textContent;

function showError(message) {
  errorBox.textContent = message;
  errorBox.hidden = false;
}

function setBusy(busy, label) {
  submitBtn.disabled = busy;
  submitBtn.textContent = busy ? label : submitLabel;
}

// Already signed in? Skip this page.
if (getToken()) window.location.replace(safeNextUrl());

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  errorBox.hidden = true;
  const name = $("name").value.trim();
  const orgName = $("org").value.trim();
  const email = $("email").value.trim();
  const password = $("password").value;

  if (!name || !orgName || !email) {
    showError("Fill in every field.");
    return;
  }
  if (password.length < 10) {
    showError("Password must be at least 10 characters.");
    $("password").focus();
    return;
  }
  if (password !== $("confirm").value) {
    showError("The two passwords don't match.");
    $("confirm").focus();
    return;
  }

  setBusy(true, "Creating organization…");
  try {
    await signupRequest({ email, password, name, orgName });
    await loginRequest(email, password);
    window.location.replace(HOME_PAGE);
  } catch (err) {
    showError(err.message);
    setBusy(false);
  }
});
</script>
